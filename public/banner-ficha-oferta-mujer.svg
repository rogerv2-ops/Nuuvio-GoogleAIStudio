<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <clipPath id="roundedBanner">
      <rect x="0" y="0" width="1200" height="600" rx="36" ry="36" />
    </clipPath>
    <clipPath id="cardClip1">
      <rect x="0" y="0" width="160" height="85" rx="16" ry="16" />
    </clipPath>
    <clipPath id="cardClip2">
      <rect x="0" y="0" width="160" height="85" rx="16" ry="16" />
    </clipPath>
    <clipPath id="cardClip3">
      <rect x="0" y="0" width="160" height="85" rx="16" ry="16" />
    </clipPath>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.18" flood-color="#000" />
    </filter>
    <linearGradient id="scrimLeft" x1="0%" y1="0%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.80" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.00" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#E63900" />
    </linearGradient>
  </defs>

  <g clip-path="url(#roundedBanner)">
    <!-- Base Background Street Image -->
    <image
      href="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&amp;fit=crop&amp;w=1400&amp;h=700&amp;q=85"
      x="0"
      y="-40"
      width="1200"
      height="680"
      preserveAspectRatio="xMidYMid slice"
    />

    <!-- Left White/Sun Gradient Scrim for readable typography -->
    <rect x="0" y="0" width="700" height="600" fill="url(#scrimLeft)" />

    <!-- Sparkle lines above phone -->
    <path d="M 680 290 L 675 275" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M 695 285 L 698 270" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M 710 292 L 720 280" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

    <!-- LEFT TYPOGRAPHY -->
    <text x="50" y="140" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="70" fill="#0B132B" letter-spacing="-1.5">
      Ofertas cerca
    </text>
    <text x="50" y="215" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="70" fill="#0B132B" letter-spacing="-1.5">
      de ti.
    </text>
    <text x="50" y="290" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="70" fill="#FF4A22" letter-spacing="-1.5">
      Solo cuando
    </text>
    <text x="50" y="365" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="70" fill="#FF4A22" letter-spacing="-1.5">
      las quieres.
    </text>

    <!-- 3 Checklist Items -->
    <!-- Item 1: Sin spam -->
    <g transform="translate(50, 395)">
      <circle cx="16" cy="16" r="14" fill="#0F172A" fill-opacity="0.06" />
      <path d="M 16 9 C 13.5 9 11.5 11 11.5 13.5 C 11.5 17 9.5 18 9.5 18 L 22.5 18 C 22.5 18 20.5 17 20.5 13.5 C 20.5 11 18.5 9 16 9 Z" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />
      <path d="M 14.5 20 C 14.8 21.2 15.8 22 16 22 C 16.2 22 17.2 21.2 17.5 20" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />
      <line x1="10" y1="10" x2="22" y2="22" stroke="#FF4A22" stroke-width="2.5" stroke-linecap="round" />
      <text x="42" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#0F172A">
        Sin spam.
      </text>
    </g>

    <!-- Item 2: Sin perder tiempo buscando -->
    <g transform="translate(50, 435)">
      <circle cx="16" cy="16" r="14" fill="#0F172A" fill-opacity="0.06" />
      <circle cx="15" cy="15" r="6" fill="none" stroke="#0F172A" stroke-width="2" />
      <line x1="19.5" y1="19.5" x2="24" y2="24" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />
      <text x="42" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#0F172A">
        Sin perder tiempo buscando.
      </text>
    </g>

    <!-- Item 3: Solo oportunidades de tu zona -->
    <g transform="translate(50, 475)">
      <circle cx="16" cy="16" r="14" fill="#0F172A" fill-opacity="0.06" />
      <path d="M 16 22 C 16 22 10 17 10 13.5 C 10 11 12.5 9 14.5 10.5 C 16 11.5 16 11.5 16 11.5 C 16 11.5 16 11.5 17.5 10.5 C 19.5 9 22 11 22 13.5 C 22 17 16 22 16 22 Z" fill="none" stroke="#0F172A" stroke-width="2" stroke-linejoin="round" />
      <text x="42" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#0F172A">
        Solo oportunidades de tu zona.
      </text>
    </g>

    <!-- RIGHT FLOATING CARDS WITH RED PINS -->

    <!-- Pin 1 -->
    <g transform="translate(860, 50)">
      <circle cx="15" cy="15" r="14" fill="#E11D48" />
      <circle cx="15" cy="15" r="5" fill="#FFFFFF" />
      <path d="M 15 28 L 15 38" stroke="#E11D48" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Card 1: Café + Croissant (-50%) -->
    <g transform="translate(900, 20)" filter="url(#cardShadow)">
      <rect width="250" height="135" rx="20" fill="#FFFFFF" />
      <!-- Image container -->
      <g transform="translate(10, 10)" clip-path="url(#cardClip1)">
        <image href="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&amp;fit=crop&amp;w=280&amp;h=160&amp;q=80" x="0" y="0" width="160" height="85" preserveAspectRatio="xMidYMid slice" />
      </g>
      <!-- Badge -50% -->
      <rect x="180" y="10" width="60" height="28" rx="8" fill="#E11D48" />
      <text x="210" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" text-anchor="middle">-50%</text>
      <!-- Title & Distance -->
      <text x="12" y="112" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#0F172A">Café + Croissant</text>
      <text x="12" y="128" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#E11D48">📍 A 3 min de ti</text>
    </g>

    <!-- Pin 2 -->
    <g transform="translate(940, 215)">
      <circle cx="15" cy="15" r="14" fill="#E11D48" />
      <circle cx="15" cy="15" r="5" fill="#FFFFFF" />
      <path d="M 15 28 L 15 38" stroke="#E11D48" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Card 2: Zapatillas (-40%) -->
    <g transform="translate(975, 185)" filter="url(#cardShadow)">
      <rect width="210" height="135" rx="20" fill="#FFFFFF" />
      <g transform="translate(10, 10)" clip-path="url(#cardClip2)">
        <image href="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&amp;fit=crop&amp;w=280&amp;h=160&amp;q=80" x="0" y="0" width="130" height="85" preserveAspectRatio="xMidYMid slice" />
      </g>
      <rect x="150" y="10" width="50" height="28" rx="8" fill="#E11D48" />
      <text x="175" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" text-anchor="middle">-40%</text>
      <text x="12" y="112" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#0F172A">Zapatillas</text>
      <text x="12" y="128" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#E11D48">📍 A 5 min de ti</text>
    </g>

    <!-- Pin 3 -->
    <g transform="translate(875, 370)">
      <circle cx="15" cy="15" r="14" fill="#E11D48" />
      <circle cx="15" cy="15" r="5" fill="#FFFFFF" />
      <path d="M 15 28 L 15 38" stroke="#E11D48" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Card 3: Hamburguesa (-30%) -->
    <g transform="translate(910, 340)" filter="url(#cardShadow)">
      <rect width="230" height="135" rx="20" fill="#FFFFFF" />
      <g transform="translate(10, 10)" clip-path="url(#cardClip3)">
        <image href="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&amp;fit=crop&amp;w=280&amp;h=160&amp;q=80" x="0" y="0" width="145" height="85" preserveAspectRatio="xMidYMid slice" />
      </g>
      <rect x="165" y="10" width="55" height="28" rx="8" fill="#E11D48" />
      <text x="192" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" text-anchor="middle">-30%</text>
      <text x="12" y="112" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#0F172A">Hamburguesa</text>
      <text x="12" y="128" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#E11D48">📍 A 6 min de ti</text>
    </g>

    <!-- ================= BOTTOM HORIZONTAL 3-STEP STRIP ================= -->
    <g transform="translate(40, 505)" filter="url(#cardShadow)">
      <rect width="1120" height="75" rx="24" fill="#FFFFFF" />

      <!-- STEP 1 -->
      <g transform="translate(20, 15)">
        <circle cx="22" cy="22" r="18" fill="url(#orangeGrad)" />
        <text x="22" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">1</text>
        <g transform="translate(50, 2)">
          <text x="0" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#0F172A" letter-spacing="0.5">ELIGE TUS ZONAS</text>
          <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#475569">Selecciona tus distritos de casa, trabajo o donde sueles comprar.</text>
        </g>
      </g>

      <line x1="390" y1="12" x2="390" y2="62" stroke="#E2E8F0" stroke-width="1.5" />

      <!-- STEP 2 -->
      <g transform="translate(415, 15)">
        <circle cx="22" cy="22" r="18" fill="url(#orangeGrad)" />
        <text x="22" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">2</text>
        <!-- WhatsApp Pill -->
        <g transform="translate(50, 4)">
          <rect x="0" y="0" width="85" height="34" rx="10" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1" />
          <circle cx="16" cy="17" r="8" fill="#22C55E" />
          <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#15803D">Oferta</text>
          <g transform="translate(98, 2)">
            <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#0F172A" letter-spacing="0.5">PIDE UNA OFERTA</text>
            <text x="0" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="10.5" fill="#475569">Escribe "Oferta" o toca Pedir. Te mostramos 3–5 ofertas cercanas.</text>
          </g>
        </g>
      </g>

      <line x1="775" y1="12" x2="775" y2="62" stroke="#E2E8F0" stroke-width="1.5" />

      <!-- STEP 3 -->
      <g transform="translate(800, 15)">
        <circle cx="22" cy="22" r="18" fill="url(#orangeGrad)" />
        <text x="22" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">3</text>
        <g transform="translate(50, 2)">
          <text x="0" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#0F172A" letter-spacing="0.5">ELIGE Y CONTACTA</text>
          <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#475569">¿Te interesa? Habla directamente con el comercio por WhatsApp sin intermediarios.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
